const KEY="vce-final-revision-v1";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||INITIAL;
if(!state.tasks) state=INITIAL;
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const pct=(a,b)=>b?Math.round(a/b*100):0;
const todayISO=()=>{let d=new Date();let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`};
const fmt=d=>new Date(d+"T00:00:00").toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long"});
const taskGroups=()=>[...new Set(state.tasks.map(x=>x.date))].sort();

function renderToday(){
 const d=todayISO(), ts=state.tasks.filter(x=>x.date===d), done=ts.filter(x=>x.completed).length;
 document.getElementById("headerSub").textContent=new Date().toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long"});
 let h=`<div class="card hero"><div class="small">TODAY'S PROGRESS</div><div class="big">${pct(done,ts.length)}%</div><div class="progress"><div class="bar" style="width:${pct(done,ts.length)}%"></div></div><div class="small">${done} of ${ts.length} tasks complete</div></div>`;
 h+=`<div class="section-title">Today's tasks</div>`;
 if(!ts.length) h+=`<div class="card empty">No tasks scheduled for today 🎉</div>`;
 else h+=`<div class="card">${ts.map(taskHTML).join("")}</div>`;
 document.getElementById("today").innerHTML=h;
 document.querySelectorAll("#today input[data-task]").forEach(i=>i.onchange=()=>toggleTask(i.dataset.task));
}
function taskHTML(t){return `<label class="task ${t.completed?"done":""}"><input type="checkbox" data-task="${t.id}" ${t.completed?"checked":""}><div><div class="subject">${esc(t.subject)}</div><div class="tasktext">${esc(t.task)}</div></div></label>`}
function toggleTask(id){let t=state.tasks.find(x=>x.id===id);if(t){t.completed=!t.completed;save();renderAll()}}
function renderCalendar(){
 let h=`<div class="section-title">📅 Revision calendar</div><div class="card">`;
 for(const d of taskGroups()){
  const ts=state.tasks.filter(x=>x.date===d), done=ts.filter(x=>x.completed).length;
  h+=`<div class="day"><div class="dayhead"><div class="date">${fmt(d)}</div><div class="count">${done}/${ts.length}</div></div><div class="progress"><div class="bar" style="width:${pct(done,ts.length)}%"></div></div><details><summary class="small">View tasks</summary>${ts.map(taskHTML).join("")}</details></div>`;
 }
 h+=`</div>`;document.getElementById("calendar").innerHTML=h;
 document.querySelectorAll("#calendar input[data-task]").forEach(i=>i.onchange=()=>toggleTask(i.dataset.task));
}
let topicFilter="All", topicSearch="";
function renderTopics(){
 let subjects=["All",...state.subjects.filter(x=>x!=="Review / Notes")];
 let filtered=state.topics.filter(t=>(topicFilter==="All"||t.subject===topicFilter)&&(`${t.topic} ${t.unit}`.toLowerCase().includes(topicSearch.toLowerCase())));
 let h=`<div class="section-title">📚 Topic tracker</div><input class="search" id="topicSearch" placeholder="Search topics..." value="${esc(topicSearch)}"><div class="pillrow" style="margin-top:10px">${subjects.map(s=>`<button class="pill ${topicFilter===s?"active":""}" data-filter="${esc(s)}">${esc(s)}</button>`).join("")}</div><div class="card">`;
 h+=filtered.map(t=>`<div class="topic"><div class="topicname">${esc(t.topic)}</div><div class="unit">${esc(t.subject)}${t.unit?" · "+esc(t.unit):""}</div><div class="checks">${check(t,"first","First Pass")} ${check(t,"review1","Review 1")} ${check(t,"review2","Review 2")} ${check(t,"ready","Exam Ready")}</div></div>`).join("")||`<div class="empty">No topics found.</div>`;
 h+=`</div>`;document.getElementById("topics").innerHTML=h;
 document.getElementById("topicSearch").oninput=e=>{topicSearch=e.target.value;renderTopics()};
 document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{topicFilter=b.dataset.filter;renderTopics()});
 document.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>toggleTopic(b.dataset.topic,b.dataset.stage));
}
function check(t,k,label){return `<button class="checkbtn ${t[k]?"on":""}" data-topic="${t.id}" data-stage="${k}">${t[k]?"✓ ":""}${label}</button>`}
function toggleTopic(id,k){let t=state.topics.find(x=>x.id===id);if(t){t[k]=!t[k];save();renderAll()}}
function renderProgress(){
 let h=`<div class="section-title">📊 My progress</div>`;
 const allTasks=state.tasks, td=allTasks.filter(x=>x.completed).length;
 h+=`<div class="card hero"><div class="small">ALL REVISION TASKS</div><div class="big">${pct(td,allTasks.length)}%</div><div class="progress"><div class="bar" style="width:${pct(td,allTasks.length)}%"></div></div><div class="small">${td} of ${allTasks.length} completed</div></div>`;
 h+=`<div class="grid">`;
 for(const s of state.subjects.filter(x=>x!=="Review / Notes")){
  const ts=allTasks.filter(x=>x.subject===s), n=ts.filter(x=>x.completed).length;
  h+=`<div class="stat"><b>${pct(n,ts.length)}%</b><span>${esc(s)}</span></div>`;
 }
 h+=`</div><div class="section-title">Topic mastery</div><div class="card">`;
 for(const [k,label] of [["first","First Pass"],["review1","Review 1"],["review2","Review 2"],["ready","Exam Ready"]]){
  const n=state.topics.filter(t=>t[k]).length;
  h+=`<div style="margin:13px 0"><div class="dayhead"><b>${label}</b><span class="count">${n}/${state.topics.length}</span></div><div class="progress"><div class="bar" style="width:${pct(n,state.topics.length)}%"></div></div></div>`;
 }
 h+=`</div>`;document.getElementById("progress").innerHTML=h;
}
function renderAll(){renderToday();renderCalendar();renderTopics();renderProgress()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(b.dataset.screen).classList.add("active");});
renderAll();
</script>
